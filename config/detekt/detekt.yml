# Project rules on top of detekt's default config (buildUponDefaultConfig = true).

style:
  # Security rule (design §9, §55): no logging or console output that could leak secrets.
  ForbiddenImport:
    active: true
    imports:
      - value: 'android.util.Log'
        reason: 'Logging is forbidden: secrets must never reach Logcat (design §55).'
  ForbiddenMethodCall:
    active: true
    methods:
      - value: 'kotlin.io.print'
        reason: 'Console output is forbidden (design §55).'
      - value: 'kotlin.io.println'
        reason: 'Console output is forbidden (design §55).'
      - value: 'java.lang.Throwable.printStackTrace'
        reason: 'Stack traces go to Logcat (design §55).'
      - value: 'android.util.Log.v'
      - value: 'android.util.Log.d'
      - value: 'android.util.Log.i'
      - value: 'android.util.Log.w'
      - value: 'android.util.Log.e'
      - value: 'android.util.Log.wtf'
      - value: 'android.util.Log.println'
  MagicNumber:
    # A named property is exactly the fix MagicNumber asks for.
    ignorePropertyDeclaration: true
    # Enum entries such as AutoLockTimeout(30_000) name their values already.
    ignoreEnums: true
  ReturnCount:
    # Validation code uses early `?: return fail(...)` guards on purpose.
    active: false

complexity:
  LongParameterList:
    # Domain models such as OtpUri legitimately carry seven fields.
    constructorThreshold: 8
    # Serialization DTOs mirror the stored format field by field.
    ignoreAnnotated: ['Serializable']
  TooManyFunctions:
    # Repositories expose one function per operation.
    thresholdInClasses: 16

naming:
  FunctionNaming:
    # Compose functions are PascalCase.
    ignoreAnnotated: ['Composable']
