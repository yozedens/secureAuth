name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *"  # 02:00 Beijing time

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build, test and check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and coverage (core, >= 80%)
        run: ./gradlew :core:test :core:koverVerify :core:koverLog

      - name: Static analysis (detekt with type resolution)
        run: ./gradlew detektMain

      - name: Android lint (release)
        run: ./gradlew :app:lintRelease

      - name: Assemble release APK and compile instrumented tests
        run: ./gradlew :app:assembleRelease :app:assembleDebugAndroidTest

      - name: Check APK security baseline
        run: scripts/check-apk.sh app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Release signing dry run (throwaway key)
        # Exercises the signing config and the checks the Release workflow runs; the key is
        # generated here and discarded, it is never the real release key.
        run: |
          pass="$(openssl rand -hex 16)"
          keytool -genkeypair -keystore "$RUNNER_TEMP/dry-run.jks" -storetype PKCS12 \
            -keyalg RSA -keysize 2048 -validity 1 -alias dry-run \
            -dname "CN=SecureAuth dry run" -storepass "$pass" -keypass "$pass"
          SECUREAUTH_KEYSTORE="$RUNNER_TEMP/dry-run.jks" SECUREAUTH_KEYSTORE_PASSWORD="$pass" \
            SECUREAUTH_KEY_ALIAS=dry-run SECUREAUTH_KEY_PASSWORD="$pass" \
            ./gradlew :app:assembleRelease
          rm -f "$RUNNER_TEMP/dry-run.jks"
          apk=app/build/outputs/apk/release/app-release.apk
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)"
          "$apksigner" verify --verbose --print-certs "$apk" | tee signing.txt
          grep -qE "Verified using v[23] scheme .*: true" signing.txt
          scripts/check-apk.sh "$apk"

      - name: Build debug APK for manual testing
        run: ./gradlew :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: secureauth-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/
            app/build/outputs/logs/

  instrumented:
    name: Instrumented tests (emulator)
    # Emulator runs are slow: on demand or nightly (plan §4.5).
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 35]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run connected tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          # On failure, print the JUnit XML so assertion messages (screen dumps) reach the log.
          script: ./gradlew :app:connectedDebugAndroidTest || { find app/build/outputs/androidTest-results -name '*.xml' -exec cat {} +; exit 1; }

      - name: Upload instrumented test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-reports-api${{ matrix.api-level }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          retention-days: 7
